[package]
name = "foundations-agent-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
async-openai = "0.27"
atty = "0.2"
regex = "1"
reqwest = { version = "0.12", features = ["blocking"] }
rustyline = "15"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wait-timeout = "0.2"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dev-dependencies]
tempfile = "3"
