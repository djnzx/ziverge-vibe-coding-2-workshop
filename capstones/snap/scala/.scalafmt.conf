version = "3.11.5"
runner.dialect = scala3
maxColumn = 160
indent.main = 2
indent.callSite = 2
indent.defnSite = 2
align.preset = more
rewrite.rules = [
  SortImports,
  RedundantBraces,
  RedundantParens
]

# .sbt files (build.sbt, project/plugins.sbt) align only on `:=` and the dependency
# operators; `align.preset = more` still governs the .scala sources.
fileOverride {
  "glob:**/*.sbt" {
    align.preset = none
    align.tokens = [":=", "%", "%%", "%%%"]
  }
}
